<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How a Stirling engine works</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.fx-stage{position:relative}
.fx-stage>svg,.fx-stage>canvas{display:block;width:100%;height:auto}
.fx-stage>.fx-layer{position:absolute;inset:0;height:100%!important;pointer-events:none}
.iso:not([data-theme="light"]) .fx-gl{mix-blend-mode:screen}
.glass{opacity:.5}
.iso[data-theme="light"] .glass{opacity:.85}
.iso[data-theme="light"] .glass .iso-edge{stroke:var(--anatomy-mid)}
.gas{stroke:none;fill:var(--st-gas);opacity:0}
.disp .iso-fill,.disp .iso-shade{fill:var(--st-hot)}
.disp .iso-top{fill:#e8834a}
.iso[data-theme="light"] .disp .iso-top{fill:#d96a2a}
.disp .iso-edge{stroke:var(--anatomy-hi)}
.hotband .iso-fill,.hotband .iso-top,.hotband .iso-shade{fill:var(--st-hot);opacity:.5}
.iso[data-theme="dark"] .hotband .iso-fill,.iso[data-theme="dark"] .hotband .iso-top,.iso[data-theme="dark"] .hotband .iso-shade{opacity:.38}

.pv-pin-core{fill:var(--anatomy-lo);stroke:none}
.iso{--st-gas:#e07a3c;--st-hot:#c9502a;--st-ink:#b44a1e}
.iso[data-theme="light"]{--st-gas:#c05a1a;--st-hot:#a83d12;--st-ink:#a83d12}
.pv-card{margin-top:26px}
.pv-plate{position:relative;padding:10px 12px 12px}
.pv{display:block;width:100%;height:auto}
.pv-grid line{stroke:var(--anatomy-faint);stroke-width:.6}
.pv-axes line{stroke:var(--anatomy-mid);stroke-width:.8}
.pv-axis{fill:var(--anatomy-strong);font:italic 12px Georgia,serif}
.pv-unit{fill:var(--anatomy-muted);font:9px var(--anatomy-mono)}
.pv-tick{fill:var(--anatomy-muted);font:9px var(--anatomy-mono)}
.pv-iso path{fill:none;stroke:var(--anatomy-lo);stroke-width:1;stroke-dasharray:3 3}
.pv-isolabel{fill:var(--anatomy-muted);font:9px var(--anatomy-mono)}
.pv-loop{fill:none;stroke:var(--anatomy-lo);stroke-width:1}
.pv-arc{fill:none;stroke:var(--anatomy-mid);stroke-width:1.6;stroke-linecap:round;transition:stroke .25s,stroke-width .25s}
.pv-arc[data-on]{stroke:var(--anatomy-lit);stroke-width:2.6}
.iso[data-theme="light"] .pv-arc[data-on]{stroke:var(--st-ink)}
.pv-guides line{stroke:var(--anatomy-muted);stroke-width:.6;stroke-dasharray:2 3}
.pv-dot .pv-centre{fill:var(--anatomy-lit);stroke:var(--anatomy-card);stroke-width:1}
.iso[data-theme="light"] .pv-dot .pv-centre{fill:var(--st-ink)}
.pv-dot .pv-pulse{fill:none;stroke:var(--anatomy-lit);stroke-width:1;opacity:.7;animation:pv-pulse 1.3s ease-out infinite}
.iso[data-theme="light"] .pv-dot .pv-pulse{stroke:var(--st-ink)}
@keyframes pv-pulse{0%{r:4;opacity:.8}100%{r:11;opacity:0}}
.pv-stage{fill:var(--anatomy-text);font:10px ui-sans-serif,system-ui,sans-serif;transition:fill .25s}
.pv-stage[data-on]{fill:var(--anatomy-strong);font-weight:600}
.ctl{padding:2px 4px 0}
.ctl-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ctl-cluster{display:flex;border:1px solid var(--anatomy-faint);border-radius:8px;overflow:hidden}
.ctl-btn{appearance:none;background:var(--anatomy-card);color:var(--anatomy-strong);border:0;border-right:1px solid var(--anatomy-faint);
  min-width:46px;height:40px;font-size:13px;cursor:pointer}
.ctl-btn:last-child{border-right:0}
.ctl-btn:hover{background:var(--anatomy-face)}
.ctl-run{font-size:11px;letter-spacing:1px}
.ctl-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pill{appearance:none;background:none;border:1px solid var(--anatomy-faint);border-radius:999px;color:var(--anatomy-muted);
  padding:7px 13px;font:12px ui-sans-serif,system-ui,sans-serif;cursor:pointer;min-height:34px}
.pill b{color:var(--anatomy-text);margin-right:3px}
.pill[data-on]{border-color:var(--anatomy-mid);color:var(--anatomy-strong);background:var(--anatomy-face)}
.ctl-stage{margin-top:12px;height:66px}
@media (max-width:520px){.ctl-stage{height:104px}}
.ctl-name{font:600 13px ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-strong)}
.ctl-text{margin-top:3px;font:12.5px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--anatomy-text)}
@media (prefers-reduced-motion:reduce){.pv-dot .pv-pulse{animation:none;opacity:0}}

      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);

  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

const D = {"W":680,"H":430,"camera":{"origin":[311.3918651292268,248.49244997877986],"k":1.5149656563385578,"cam":[0.6691306063588582,0.7431448254773942,0.49999999999999994,0.8660254037844387]},"proj":{"origin":[311.3918651292268,248.49244997877986],"scale":1.1976855127404369,"azimuth":42,"elevation":30},"hot":[-25,0],"crank":[105,40],"r":13,"scale":1.5149656563385578,"stages":[{"centre":1.5707963267948966,"name":"Isothermal expansion","short":"Expansion","text":"The displacer holds the gas against the hot end. It expands at about 600 K and pushes the power piston out — heat flows in from the flame and the gas does the work."},{"centre":3.141592653589793,"name":"Isochoric cooling","short":"Cooling","text":"The piston sits near full volume while the displacer sweeps the gas through the hot regenerator mesh into the cold space. The mesh soaks up the heat; pressure falls at constant volume."},{"centre":4.71238898038469,"name":"Isothermal compression","short":"Compression","text":"The gas now lies against the cold end. The flywheel drives the piston in at about 300 K and the rejected heat leaves through the finned top of the cylinder."},{"centre":6.283185307179586,"name":"Isochoric heating","short":"Heating","text":"At minimum volume the displacer moves the gas back through the mesh, which returns the heat stored last stroke. Pressure climbs at constant volume — ready to expand again."}],"chart":{"cx":[0.8,2.85],"cy":[0,112],"l":64,"t":18,"w":620,"h":300,"b":44,"r":18},"TH":600,"TC":300,"NR":0.1663,"VC":1.8,"VS":0.8};
const P = D.proj;
const stage = document.querySelector(".fx-stage");
const svg = stage.querySelector("svg");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const LIGHT = document.body.dataset.theme === "light" ? 1 : 0;
const V = (t) => D.VC - D.VS * Math.cos(t);
const XD = (t) => (1 + Math.sin(t)) / 2;
const TEFF = (t) => D.TC + (D.TH - D.TC) * XD(t);
const POF = (t) => (D.NR * TEFF(t)) / V(t);
const stageAt = (t) => { const d = ((t % 6.28318) + 6.28318) % 6.28318; return Math.floor(((d + 5.49779) % 6.28318) / 1.5708); };
const C = D.chart;
const chartX = (v) => C.l + ((v - C.cx[0]) / (C.cx[1] - C.cx[0])) * (C.w - C.l - C.r);
const chartY = (p) => C.h - C.b - ((p - C.cy[0]) / (C.cy[1] - C.cy[0])) * (C.h - C.t - C.b);

const parts = {};
for (const el of svg.querySelectorAll("[data-part]")) parts[el.dataset.part] = el;
const pvDot = document.querySelector('[data-part="pv-dot"]');
const pvArcs = [...document.querySelectorAll(".pv-arc")];
const pvLabels = [...document.querySelectorAll(".pv-stage")];
const pills = [...document.querySelectorAll(".pill")];
const guideV = document.querySelector('[data-guide="v"]');
const guideP = document.querySelector('[data-guide="p"]');
const readout = document.querySelector("[data-readout]");
const readoutPv = document.querySelector("[data-readout-pv]");
const nameEl = document.querySelector("[data-stage-name]");
const textEl = document.querySelector("[data-stage-text]");
const runBtn = document.querySelector('[data-act="run"]');
const gasHot = document.querySelector(".gas-hot");
const gasPower = document.querySelector(".gas-power");

function pinSvg(x, y, z) {
  const q = iso([x, y, z], P);
  const s = D.scale;
  return '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (3.2 * s).toFixed(1) + '" class="pv-pin"/>' +
         '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (1.1 * s).toFixed(1) + '" class="pv-pin-core"/>';
}
function spokesSvg(t) {
  let d = "";
  for (let i = 0; i < 5; i++) {
    const a = t + (i * Math.PI * 2) / 5;
    const p0 = iso([D.crank[0] + 6 * Math.cos(a), 51, D.crank[1] + 6 * Math.sin(a)], P);
    const p1 = iso([D.crank[0] + 29 * Math.cos(a), 51, D.crank[1] + 29 * Math.sin(a)], P);
    d += "M" + p0[0].toFixed(1) + " " + p0[1].toFixed(1) + "L" + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
  }
  return '<path d="' + d + '" class="iso-line" data-tone="mid" style="stroke-width:3"/>';
}
function keywaySvg(t, y) {
  const c = iso([D.crank[0], y, D.crank[1]], P);
  const p = iso([D.crank[0] + D.r * Math.cos(t), y, D.crank[1] + D.r * Math.sin(t)], P);
  const hub = '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="1.6" class="iso-dot" data-tone="lo"/>';
  return hub + '<path d="M' + c[0].toFixed(1) + " " + c[1].toFixed(1) + "L" + p[0].toFixed(1) + " " + p[1].toFixed(1) + '" class="iso-line" data-tone="faint" style="stroke-width:2"/>';
}
function screenOffset(transformStr) {
  const m = transformStr.match(/translate\(([-\d.]+) ([-\d.]+)\)/);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0, 0];
}

let theta = Math.PI / 2;
let target = theta, running = true;
let frame = 0, last = 0, visible = false, idleTimer = 0, shownStage = -1, clock = 0;

function draw() {
  const dx = D.r * Math.cos(theta);
  const dz = D.r * (Math.sin(theta) - 1);
  const mx = translateAlong(P, [dx, 0, 0]);
  const mz = translateAlong(P, [0, 0, dz]);
  parts["power-piston"].setAttribute("transform", mx);
  parts["power-yoke"].setAttribute("transform", mx);
  parts["disp-yoke"].setAttribute("transform", mz);
  parts["disp-beam"].setAttribute("transform", mz);
  parts["disp-in"].setAttribute("transform", mz);
  parts["gas-clip-hot"].setAttribute("transform", mz);
  parts["gas-clip-pow"].setAttribute("transform", mx);
  const rodEl = parts["disp-rod"];
  rodEl.setAttribute("transform", mz);
  holdStill(rodEl, screenOffset(mz));
  const inEl = parts["disp-in"];
  inEl.setAttribute("transform", mz);
  holdStill(inEl, screenOffset(mz));
  const px = D.crank[0] + D.r * Math.cos(theta), pz = D.crank[1] + D.r * Math.sin(theta);
  parts["pin-p"].innerHTML = keywaySvg(theta, 6) + pinSvg(px, 12.01, pz);
  parts["pin-d"].innerHTML = keywaySvg(theta, 22) + pinSvg(px, 31.01, pz);
  parts["spokes"].innerHTML = spokesSvg(theta);
  const hot = XD(theta), norm = (TEFF(theta) - D.TC) / (D.TH - D.TC);
  gasHot.style.opacity = (0.07 + 0.20 * hot).toFixed(3);
  gasPower.style.opacity = (0.05 + 0.22 * norm).toFixed(3);
  const v = V(theta), p = POF(theta);
  pvDot.setAttribute("transform", "translate(" + chartX(v).toFixed(1) + " " + chartY(p).toFixed(1) + ")");
  guideV.setAttribute("x1", chartX(v)); guideV.setAttribute("x2", chartX(v));
  guideV.setAttribute("y1", chartY(p)); guideV.setAttribute("y2", C.h - C.b);
  guideP.setAttribute("x1", C.l); guideP.setAttribute("x2", chartX(v));
  guideP.setAttribute("y1", chartY(p)); guideP.setAttribute("y2", chartY(p));
  const s = stageAt(theta);
  if (s !== shownStage) {
    shownStage = s;
    pvArcs.forEach((a, i) => (i === s ? a.setAttribute("data-on", "") : a.removeAttribute("data-on")));
    pvLabels.forEach((a, i) => (i === s ? a.setAttribute("data-on", "") : a.removeAttribute("data-on")));
    pills.forEach((a, i) => (i === s ? a.setAttribute("data-on", "") : a.removeAttribute("data-on")));
    nameEl.textContent = (s + 1) + " \u00b7 " + D.stages[s].name;
    textEl.textContent = D.stages[s].text;
  }
  const words = D.stages[s].short.toLowerCase() + " \u00b7 " + p.toFixed(1) + " kPa \u00b7 " + v.toFixed(2) + " L \u00b7 " + Math.round(TEFF(theta)) + " K";
  if (readout.textContent !== words) readout.textContent = words;
  if (readoutPv.textContent !== words) readoutPv.textContent = words;
  stage.setAttribute("aria-valuetext", words);
  if (layer) layer.draw({ uHot: hot }, still.matches ? 0 : clock);
}

// ------------------------------------------------------------- flame ---------
const FRAGMENT = "\nuniform float uHot;\nuniform float uLight;\nconst vec2 HOTC = vec2(-25.0,0.0);\nfloat flameField(vec3 p, float t){\n  float r = length(p.xy - HOTC);\n  float h = p.z;\n  float base = 22.0, top = 46.0;\n  float u = (h - base) / (top - base);\n  float rad = 7.0 * (1.0 - 0.5 * u) * (1.0 - smoothstep(0.75, 1.0, u));\n  float flick = 0.75 + 0.25 * sin(t * 11.0 + h * 0.5 + r * 0.9) * noise3(vec3(p.xy * 0.25, t * 1.6 + h * 0.12));\n  float body = 1.0 - smoothstep(rad * 0.25, rad * flick, r);\n  body *= window(u, -0.05, 1.05, 0.12);\n  return body * (1.0 - u * 0.55);\n}\nvoid main(){\n  vec2 vb = viewOf(gl_FragCoord.xy);\n  vec3 acc = vec3(0.0); float accA = 0.0;\n  vec3 p0 = rayOf(vb);\n  vec3 Vd = towardViewer();\n  float tA = -1e4, tB = 1e4;\n  float tz0 = (18.0 - p0.z) / Vd.z, tz1 = (50.0 - p0.z) / Vd.z;\n  tA = max(tA, min(tz0, tz1)); tB = min(tB, max(tz0, tz1));\n  vec2 o = p0.xy - HOTC, d = Vd.xy;\n  float a = dot(d, d), b = 2.0 * dot(o, d), c = dot(o, o) - 20.0 * 20.0;\n  float disc = b * b - 4.0 * a * c;\n  if (disc <= 0.0 || tB <= tA) { gl_FragColor = vec4(0.0); return; }\n  float sq = sqrt(disc);\n  tA = max(tA, (-b - sq) / (2.0 * a)); tB = min(tB, (-b + sq) / (2.0 * a));\n  if (tB <= tA) { gl_FragColor = vec4(0.0); return; }\n  float N = 22.0;\n  float dt = (tB - tA) / N;\n  float jitter = hash12(gl_FragCoord.xy);\n  for (float i = 0.0; i < 22.0; i += 1.0) {\n    float t = tA + (i + jitter) * dt;\n    vec3 p = p0 + Vd * t;\n    float f = flameField(p, uTime);\n    if (f <= 0.001) continue;\n    float tc = dot(vec3(HOTC, 32.0) - p0, Vd);\n    float dper = length(cross(Vd, vec3(HOTC, 32.0) - p0));\n    float occl = 1.0;\n    if (tc > tA && tc < tB && dper < 15.0) {\n      float tLow = tc - sqrt(max(15.0 * 15.0 - dper * dper, 0.0));\n      occl = 1.0 / (1.0 + exp(2.41 * (tLow - t) / max(dt, 0.001)));\n    }\n    float dens = f * dt * 1.35 * occl;\n    float u = clamp((p.z - 22.0) / 24.0, 0.0, 1.0);\n    vec3 col = mix(vec3(1.0, 0.88, 0.55), vec3(1.0, 0.45, 0.10), smoothstep(0.05, 0.5, u));\n    col = mix(col, vec3(0.85, 0.22, 0.06), smoothstep(0.55, 1.0, u));\n    float core = (1.0 - smoothstep(0.0, 5.0, length(p.xy - HOTC))) * (1.0 - smoothstep(0.25, 0.8, u));\n    col += vec3(1.0, 0.9, 0.7) * core * 0.8;\n    vec3 emit = col * dens * (0.55 + 0.45 * uHot);\n    acc += emit * (1.0 - accA);\n    accA += dens * (0.9 - 0.4 * u) * (1.0 - accA);\n  }\n  vec3 pf = onFloor(vb, 0.0);\n  float rp = length(pf.xy - HOTC);\n  float pool = exp(-pow(rp / 26.0, 2.0)) * (1.0 - smoothstep(20.0, 28.0, rp));\n  acc += vec3(1.0, 0.5, 0.18) * pool * 0.30 * (0.6 + 0.4 * uHot);\n  acc = tonemap(acc, 1.2);\n  float m = max(acc.r, max(acc.g, acc.b));\n  float n = (hash12(gl_FragCoord.xy + fract(uTime * 0.61) * 91.0) + hash12(gl_FragCoord.yx * 1.37 + fract(uTime * 0.37) * 57.0) - 1.0) / 255.0;\n  acc = max(acc + n * smoothstep(0.0, 1.5 / 255.0, m), 0.0);\n  float a2 = max(m, accA);\n  vec4 dark = vec4(acc, a2);\n  vec3 inkCol = mix(vec3(1.0, 0.55, 0.16), vec3(0.75, 0.22, 0.05), smoothstep(0.2, 0.9, m));\n  float inkA = 0.92 * (1.0 - exp(-2.6 * (m + accA)));\n  vec4 light = vec4(inkCol * inkA, inkA);\n  gl_FragColor = mix(dark, light, uLight);\n}";

let layer = null;
try {
  layer = glLayer({
    canvas: stage.querySelector(".fx-gl"),
    fragment: FRAGMENT,
    view: [D.W, D.H],
    camera: D.camera,
    uniforms: ["uHot"],
    fixed: { uLight: LIGHT },
  });
} catch (e) { layer = null; }
if (layer) stage.setAttribute("data-gl", "");

// ------------------------------------------------------------- loop ----------
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (running) { theta += dt * 1.15; target = theta; }
  else { theta += (target - theta) * (1 - Math.exp(-dt / 0.22)); if (Math.abs(target - theta) < 0.0005) theta = target; }
  draw();
  frame = visible ? requestAnimationFrame(tick) : 0;   // flame flickers while on screen
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

function gotoStage(i) {
  running = false;
  const base = Math.floor(theta / (Math.PI * 2)) * Math.PI * 2;
  let cand = base + D.stages[i].centre;
  if (cand < theta - 0.05) cand += Math.PI * 2;
  target = cand;
  runBtn.innerHTML = "&#9654;";
  quiet();
  run();
}
function quiet() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!still.matches) { running = true; runBtn.innerHTML = "&#10074;&#10074;"; run(); }
  }, 6000);
}
document.querySelector('[data-act="prev"]').addEventListener("click", () => gotoStage((stageAt(target) + 3) % 4));
document.querySelector('[data-act="next"]').addEventListener("click", () => gotoStage((stageAt(target) + 1) % 4));
runBtn.addEventListener("click", () => {
  running = !running;
  runBtn.innerHTML = running ? "&#10074;&#10074;" : "&#9654;";
  if (running) clearTimeout(idleTimer);
  else target = Math.round(theta / (Math.PI / 2)) * (Math.PI / 2);
  run();
});
pills.forEach((p, i) => p.addEventListener("click", () => gotoStage(i)));
stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { e.preventDefault(); gotoStage((stageAt(target) + 1) % 4); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); gotoStage((stageAt(target) + 3) % 4); }
  else if (e.key === " ") { e.preventDefault(); runBtn.click(); }
});
if (still.matches) { running = false; target = Math.PI / 2; theta = target; }
draw();
</script></body></html>
